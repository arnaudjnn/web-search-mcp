services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  searxng:
    build: ./services/searxng
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_SECRET_KEY=dev-secret-key
      - SEARXNG_REDIS_URL=redis://redis:6379/0
      - PROXY_URL=${PROXY_URL:-}
    depends_on:
      - redis

  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}

  scrapling:
    build: ./services/scrapling
    ports:
      - "8000:8000"
    environment:
      # Required only for mode=stealth (LinkedIn). fast/solve work without it.
      - PROXY_URL=${PROXY_URL:-}

  camoufox:
    build: ./services/camoufox
    ports:
      - "8001:8000"
    environment:
      # Geo-targeted residential exit. Required for the sources that refuse
      # anything else; fast/solve paths on the other services work without it.
      - PROXY_URL=${CAMOUFOX_PROXY_URL:-}
      # One warmed anti-bot session per container — never raise this.
      - WORKERS=1

  web_tools:
    build:
      # The server's Dockerfile lives at the repo root — that is also what the
      # Railway "Tools" service builds, so local and deployed stay the same image
      # definition. (This previously pointed at packages/api/Dockerfile, which does
      # not exist, so the local build simply failed.)
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SEARXNG_URL=http://searxng:8080
      - CRAWL4AI_URL=http://crawl4ai:11235
      - SCRAPLING_URL=http://scrapling:8000
      - CAMOUFOX_URL=http://camoufox:8000
      - PORT=3000
    env_file:
      - .env.local
    depends_on:
      - searxng
      - crawl4ai
      - scrapling
      - camoufox
