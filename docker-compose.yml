services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  searxng:
    build: ./services/searxng
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_SECRET_KEY=dev-secret-key
      - SEARXNG_REDIS_URL=redis://redis:6379/0
      - PROXY_URL=${PROXY_URL:-}
    depends_on:
      - redis

  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}

  scrapling:
    build: ./services/scrapling
    ports:
      - "8000:8000"
    environment:
      # Required only for mode=stealth (LinkedIn). fast/solve work without it.
      - PROXY_URL=${PROXY_URL:-}

  web_tools:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SEARXNG_URL=http://searxng:8080
      - CRAWL4AI_URL=http://crawl4ai:11235
      - SCRAPLING_URL=http://scrapling:8000
      - PORT=3000
    env_file:
      - .env.local
    depends_on:
      - searxng
      - crawl4ai
      - scrapling
